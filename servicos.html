<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Serviços · Aline Dan Espaço Lounge</title>
  <meta name="description" content="Todos os serviços do Espaço Lounge em Araçatuba: cabelo, unhas, cílios, sobrancelha, penteados, maquiagem e depilação — com preço e duração de cada atendimento." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="styles.css?v=81" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-header is-solid">
    <div class="container header-inner">
      <a href="index.html" class="header-back">
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Ver o site</span>
      </a>

      <a href="index.html" class="brand" aria-label="Aline Dan — início">
        <span class="brand-script">Aline Dan</span>
        <span class="brand-sub">Espaço Lounge</span>
      </a>

      <nav class="account-nav" aria-label="Navegação">
        <a href="index.html#agendar" class="btn btn-primary btn-sm">Agendar</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="account-page">
    <section class="section">
      <div class="container">
        <header class="section-head">
          <p class="eyebrow" data-num="01">Serviços</p>
          <h2>A lista <em>completa</em></h2>
          <p class="section-sub">Preço e duração de cada atendimento, sempre à vista. Busque pelo nome ou escolha a categoria — e agende direto por aqui.</p>
        </header>

        <div class="services-search">
          <label class="sr-only" for="serviceSearch">Buscar serviço</label>
          <div class="search-field">
            <svg class="icon icon-sm search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="serviceSearch" autocomplete="off" placeholder="Buscar serviço &mdash; corte, unhas…" />
            <button type="button" class="search-clear" id="serviceSearchClear" aria-label="Limpar busca" hidden>
              <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>

        <div class="cat-chips" id="servicesCats" role="group" aria-label="Categorias de serviços"></div>
        <p class="services-count" id="servicesCount" aria-live="polite"></p>
        <div id="servicesList"><!-- preenchido via JS --></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© <span id="ano"></span> Aline Dan Espaço Lounge · Araçatuba/SP</p>
      <p><a href="https://wa.me/5518996655263" target="_blank" rel="noopener">WhatsApp (18) 99665-5263</a></p>
    </div>
  </footer>

  <script src="common.js?v=81"></script>
  <script src="servicos.js?v=81"></script>
</body>
</html>
